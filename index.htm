<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARGUS AI</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

    <div id="app">

        <aside id="sidebar">

            <div class="logo">
                <span class="wave">〰</span>
                <strong>ARGUS</strong>
            </div>

            <button id="newChatButton">
                ＋ Nouveau chat
            </button>

            <div class="section-title">
                Conversations
            </div>

            <div id="chatList"></div>

            <div class="sidebar-bottom">

                <button id="settingsButton">
                    ⚙️ Paramètres
                </button>

                <button id="logoutButton">
                    ⇥ Déconnexion
                </button>

            </div>

        </aside>


        <main>

            <header>

                <button
                    id="mobileMenuButton"
                >
                    ☰
                </button>

                <span id="currentChatTitle">
                    ARGUS
                </span>

                <span id="userNameDisplay"></span>

            </header>


            <div id="messages">

                <div id="welcome">

                    <div class="big-wave">
                        〰
                    </div>

                    <h1>
                        Bonjour, je suis ARGUS.
                    </h1>

                    <p>
                        Que puis-je faire pour vous ?
                    </p>

                </div>

            </div>


            <div class="composer-container">

                <div class="composer">

                    <textarea
                        id="messageInput"
                        placeholder="Écrivez un message..."
                    ></textarea>

                    <button
                        id="voiceButton"
                        class="voice"
                    >
                        🎙️
                    </button>

                    <button
                        id="sendButton"
                        class="send"
                    >
                        ↑
                    </button>

                </div>

                <small>
                    ARGUS peut faire des erreurs.
                </small>

            </div>

        </main>

    </div>


    <!-- AUTH -->

    <div
        id="authScreen"
        class="overlay"
    >

        <div class="card">

            <div class="auth-wave">
                〰
            </div>

            <h1>ARGUS</h1>

            <p>
                Votre assistant intelligent
            </p>


            <div id="loginForm">

                <h2>Connexion</h2>

                <input
                    id="loginUsername"
                    placeholder="Nom d'utilisateur"
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Mot de passe"
                >

                <button
                    id="loginButton"
                    class="primary"
                >
                    Se connecter
                </button>

                <p>
                    Pas encore de compte ?
                    <button
                        id="showRegisterButton"
                        class="link"
                    >
                        Créer un compte
                    </button>
                </p>

            </div>


            <div
                id="registerForm"
                class="hidden"
            >

                <h2>Créer un compte</h2>

                <input
                    id="registerUsername"
                    placeholder="Nom d'utilisateur"
                >

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Mot de passe"
                >

                <select id="registerLanguage">

                    <option value="fr">
                        🇫🇷 Français
                    </option>

                    <option value="en">
                        🇬🇧 English
                    </option>

                    <option value="es">
                        🇪🇸 Español
                    </option>

                </select>

                <button
                    id="registerButton"
                    class="primary"
                >
                    Créer mon compte
                </button>

                <p>
                    Déjà un compte ?
                    <button
                        id="showLoginButton"
                        class="link"
                    >
                        Se connecter
                    </button>
                </p>

            </div>

        </div>

    </div>


    <!-- SETTINGS -->

    <div
        id="settingsScreen"
        class="overlay hidden"
    >

        <div class="card">

            <div class="settings-title">

                <h2>
                    ⚙️ Paramètres
                </h2>

                <button
                    id="closeSettingsButton"
                >
                    ×
                </button>

            </div>


            <label>
                Thème
            </label>

            <select id="themeSelect">

                <option value="dark">
                    Sombre
                </option>

                <option value="light">
                    Clair
                </option>

            </select>


            <label>
                Langue
            </label>

            <select id="languageSelect">

                <option value="fr">
                    Français
                </option>

                <option value="en">
                    English
                </option>

                <option value="es">
                    Español
                </option>

            </select>


            <label>
                Voix
            </label>

            <select id="voiceSelect"></select>


            <button
                id="testVoiceButton"
                class="secondary"
            >
                🔊 Tester la voix
            </button>

        </div>

    </div>


    <script src="/script.js"></script>

</body>

</html>
