<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Pro Clone - Vraie IA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background-color: #212121; color: #ececec; }
        
        /* Sidebar */
        .sidebar { width: 260px; background-color: #171717; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #2f2f2f; }
        .new-chat { border: 1px solid #424242; padding: 12px; border-radius: 8px; background: transparent; color: white; cursor: pointer; text-align: left; font-weight: 500; }
        .new-chat:hover { background-color: #212121; }

        .user-plan-card { background-color: #212121; padding: 12px; border-radius: 8px; border: 1px solid #333; margin-top: auto; }
        .plan-title { font-size: 14px; font-weight: bold; color: #10a37f; margin-bottom: 5px; }
        .quota-bar { height: 6px; background-color: #424242; border-radius: 3px; overflow: hidden; margin: 8px 0; }
        .quota-progress { height: 100%; background-color: #10a37f; width: 0%; transition: width 0.3s; }
        .upgrade-btn { width: 100%; padding: 8px; background-color: #10a37f; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 8px; }
        .upgrade-btn:hover { background-color: #0e8e6d; }

        /* Chat Zone */
        .chat-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; position: relative; }
        .messages { flex: 1; overflow-y: auto; padding: 20px 15%; display: flex; flex-direction: column; gap: 20px; }
        
        .message { display: flex; gap: 15px; max-width: 800px; margin: auto; width: 100%; line-height: 1.6; }
        .user-message { justify-content: flex-end; }
        .user-bubble { background-color: #303030; padding: 10px 16px; border-radius: 20px; max-width: 70%; }
        .bot-message { justify-content: flex-start; }
        .bot-bubble { width: 100%; white-space: pre-wrap; }

        /* Input */
        .input-container { padding: 20px 15%; background-color: #212121; }
        .input-box { background-color: #303030; border-radius: 26px; padding: 10px 15px; display: flex; align-items: center; border: 1px solid #424242; }
        .input-box input { flex: 1; background: transparent; border: none; color: white; font-size: 16px; outline: none; padding: 8px; }
        .input-box button { background-color: white; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-weight: bold; }
        .input-box button:disabled { background-color: #555; cursor: not-allowed; }

        /* Modal Tarifs */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 90%; max-width: 800px; color: white; }
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .plan-box { background: #2a2a2a; padding: 20px; border-radius: 10px; border: 1px solid #444; text-align: center; }
        .plan-box.popular { border-color: #10a37f; }
        .price { font-size: 24px; font-weight: bold; margin: 15px 0; }
        .close-btn { float: right; cursor: pointer; font-size: 20px; color: #aaa; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat" onclick="location.reload()">+ Nouvelle discussion</button>
        
        <div class="user-plan-card">
            <div class="plan-title" id="currentPlanLabel">Plan Gratuit</div>
            <div style="font-size: 12px; color: #aaa;">Messages restants :</div>
            <div class="quota-bar"><div class="quota-progress" id="quotaBar"></div></div>
            <div style="font-size: 11px; color: #888;" id="quotaText">0 / 5 messages</div>
            <button class="upgrade-btn" onclick="openModal()">Changer de plan</button>
        </div>
    </div>

    <!-- Interface Chat -->
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message bot-message">
                <div class="bot-bubble" id="statusMessage">Initialisation du moteur IA dans le navigateur... Patientez un instant.</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Chargement de l'IA..." disabled onkeypress="if(event.key==='Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()" disabled>→</button>
            </div>
        </div>
    </div>

    <!-- Modal d'Abonnement -->
    <div class="modal" id="pricingModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 style="text-align: center;">Choisissez votre abonnement</h2>
            
            <div class="plans-grid">
                <div class="plan-box">
                    <h3>Free</h3>
                    <div class="price">0 € <small>/mois</small></div>
                    <p style="font-size: 13px; color: #aaa; margin-bottom: 15px;">5 messages / mois</p>
                    <button class="upgrade-btn" style="background: #444;" onclick="closeModal()">Actuel</button>
                </div>
                
                <div class="plan-box popular">
                    <h3>Pro</h3>
                    <div class="price">19,99 € <small>/mois</small></div>
                    <p style="font-size: 13px; color: #aaa; margin-bottom: 15px;">50 messages / mois</p>
                    <button class="upgrade-btn" onclick="simulatePayment('Pro', 50)">S'abonner</button>
                </div>

                <div class="plan-box">
                    <h3>Entreprise</h3>
                    <div class="price">49,99 € <small>/mois</small></div>
                    <p style="font-size: 13px; color: #aaa; margin-bottom: 15px;">Messages Illimités</p>
                    <button class="upgrade-btn" onclick="simulatePayment('Entreprise', 999999)">S'abonner</button>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    // Modèle d'IA léger fonctionnant dans le navigateur
    const selectedModel = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
    let engine;
    const chatHistory = [];

    // État de l'abonnement
    let userState = {
        plan: "Gratuit",
        maxQuota: 5,
        usedQuota: 0
    };

    async function initAI() {
        try {
            engine = await webllm.CreateMLCEngine(selectedModel);
            document.getElementById("statusMessage").innerText = "Bonjour ! L'IA est prête. Pose-moi une question !";
            document.getElementById("userInput").disabled = false;
            document.getElementById("sendBtn").disabled = false;
            document.getElementById("userInput").placeholder = "Envoyer un message...";
        } catch (error) {
            document.getElementById("statusMessage").innerText = "Erreur : Votre navigateur doit supporter WebGPU (Chrome ou Edge récents).";
        }
    }

    function updateUI() {
        document.getElementById("currentPlanLabel").innerText = "Plan " + userState.plan;
        
        if (userState.maxQuota > 1000) {
            document.getElementById("quotaText").innerText = "Illimité";
            document.getElementById("quotaBar").style.width = "100%";
        } else {
            document.getElementById("quotaText").innerText = `${userState.usedQuota} / ${userState.maxQuota} messages`;
            let percentage = (userState.usedQuota / userState.maxQuota) * 100;
            document.getElementById("quotaBar").style.width = percentage + "%";
        }
    }

    window.sendMessage = async function() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (!text || !engine) return;

        // Vérification des quotas
        if (userState.usedQuota >= userState.maxQuota) {
            appendMessage("Limite de messages atteinte ! Veuillez mettre à niveau votre abonnement pour continuer.", 'bot');
            openModal();
            return;
        }

        appendMessage(text, 'user');
        input.value = "";
        input.disabled = true;

        userState.usedQuota++;
        updateUI();

        chatHistory.push({ role: "user", content: text });
        const botBubble = appendMessage("L'IA réfléchit...", 'bot');

        try {
            const completion = await engine.chat.completions.create({ messages: chatHistory });
            const reply = completion.choices[0].message.content;
            botBubble.innerText = reply;
            chatHistory.push({ role: "assistant", content: reply });
        } catch (err) {
            botBubble.innerText = "Erreur lors de la génération de la réponse.";
        }

        input.disabled = false;
        input.focus();
    }

    function appendMessage(text, sender) {
        const messagesDiv = document.getElementById("messages");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}-message`;
        const bubble = document.createElement("div");
        bubble.className = `${sender}-bubble`;
        bubble.innerText = text;
        msgDiv.appendChild(bubble);
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return bubble;
    }

    window.openModal = function() { document.getElementById("pricingModal").style.display = "flex"; }
    window.closeModal = function() { document.getElementById("pricingModal").style.display = "none"; }

    window.simulatePayment = function(planName, newQuota) {
        alert(`Paiement simulé réussi pour l'offre ${planName} !`);
        userState.plan = planName;
        userState.maxQuota = newQuota;
        userState.usedQuota = 0;
        updateUI();
        closeModal();
    }

    updateUI();
    initAI();
</script>
</body>
</html>
