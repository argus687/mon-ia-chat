<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon IA - Chatbot</title>
    <style>
        :root {
            --bg-color: #343541;
            --sidebar-bg: #202123;
            --chat-user: #343541;
            --chat-ai: #444654;
            --text-color: #ececf1;
            --input-bg: #40414f;
            --accent-color: #10a37f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .new-chat-btn {
            background: transparent;
            border: 1px solid #565869;
            color: #fff;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #2a2b32;
        }

        .sub-box {
            background: #2a2b32;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .sub-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        /* Main Chat */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            padding: 20px 20%;
            display: flex;
            gap: 20px;
            line-height: 1.5;
        }

        .message.user {
            background-color: var(--chat-user);
        }

        .message.ai {
            background-color: var(--chat-ai);
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .user .avatar { background: #5436da; }
        .ai .avatar { background: var(--accent-color); }

        .input-area {
            padding: 20px 20%;
            background: var(--bg-color);
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #565869;
            border-radius: 8px;
            padding: 14px 45px 14px 15px;
            color: #fff;
            resize: none;
            height: 52px;
            outline: none;
        }

        .send-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: #ececf1;
            cursor: pointer;
            padding: 5px;
        }

        .send-btn:disabled {
            color: #565869;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--sidebar-bg);
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            text-align: center;
        }

        .close-modal {
            margin-top: 15px;
            background: #565869;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn" onclick="clearChat()">+ Nouveau chat</button>
        <div class="sub-box">
            <p>Statut : <strong id="user-status">Gratuit</strong></p>
            <p><small>Messages restants : <span id="quota-count">5</span>/5</small></p>
            <button class="sub-btn" onclick="openModal()">Passer Pro</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message ai">
                <div class="avatar">IA</div>
                <div class="content" id="init-status">Chargement du moteur IA dans votre navigateur... Merci de patienter.</div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-box">
                <textarea id="user-input" placeholder="Envoyez un message..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>➔</button>
            </div>
        </div>
    </div>

    <div class="modal" id="sub-modal">
        <div class="modal-content">
            <h2>Abonnement Pro</h2>
            <p style="margin: 15px 0;">Accès illimité à l'IA pour 9,99€ / mois.</p>
            <button class="sub-btn" onclick="simulateSubscribe()">Souscrire maintenant</button>
            <br>
            <button class="close-modal" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        let engine;
        const modelName = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
        
        let isPro = localStorage.getItem("isPro") === "true";
        let quota = parseInt(localStorage.getItem("quota") ?? "5");

        function updateUI() {
            document.getElementById("user-status").innerText = isPro ? "Pro" : "Gratuit";
            document.getElementById("quota-count").innerText = isPro ? "∞" : quota;
        }

        async function initEngine() {
            const statusDiv = document.getElementById("init-status");
            try {
                engine = await webllm.CreateMLCEngine(modelName, {
                    initProgressCallback: (progress) => {
                        statusDiv.innerText = `Chargement de l'IA : ${Math.round(progress.progress * 100)}%`;
                    }
                });
                statusDiv.innerText = "IA prête ! Comment puis-je vous aider aujourd'hui ?";
                document.getElementById("send-btn").disabled = false;
            } catch (err) {
                statusDiv.innerText = "Erreur : WebGPU n'est pas supporté ou activé sur ce navigateur.";
                console.error(err);
            }
        }

        window.sendMessage = async function() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            if (!isPro && quota <= 0) {
                alert("Quota gratuit épuisé ! Passez à la version Pro pour continuer.");
                openModal();
                return;
            }

            appendMessage("user", text);
            input.value = "";

            if (!isPro) {
                quota--;
                localStorage.setItem("quota", quota);
                updateUI();
            }

            const aiMsgDiv = appendMessage("ai", "...");
            document.getElementById("send-btn").disabled = true;

            try {
                const chunks = await engine.chat.completions.create({
                    messages: [{ role: "user", content: text }],
                    stream: true
                });

                let responseText = "";
                for await (const chunk of chunks) {
                    const content = chunk.choices[0]?.delta?.content || "";
                    responseText += content;
                    aiMsgDiv.innerText = responseText;
                }
            } catch (e) {
                aiMsgDiv.innerText = "Erreur lors de la génération de la réponse.";
                console.error(e);
            }

            document.getElementById("send-btn").disabled = false;
        };

        function appendMessage(role, text) {
            const container = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = `message ${role}`;
            
            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.innerText = role === "user" ? "Vous" : "IA";

            const content = document.createElement("div");
            content.className = "content";
            content.innerText = text;

            div.appendChild(avatar);
            div.appendChild(content);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            return content;
        }

        window.handleKeyPress = function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        window.clearChat = function() {
            document.getElementById("messages").innerHTML = `
                <div class="message ai">
                    <div class="avatar">IA</div>
                    <div class="content">Nouvelle discussion initialisée.</div>
                </div>`;
        };

        window.openModal = function() { document.getElementById("sub-modal").style.display = "flex"; };
        window.closeModal = function() { document.getElementById("sub-modal").style.display = "none"; };

        window.simulateSubscribe = function() {
            isPro = true;
            localStorage.setItem("isPro", "true");
            updateUI();
            closeModal();
            alert("Abonnement Pro activé !");
        };

        updateUI();
        initEngine();
    </script>
</body>
</html>
