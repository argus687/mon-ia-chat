<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon IA - Chatbot</title>
    <style>
        :root {
            --bg-main: #212121;
            --bg-sidebar: #171717;
            --bg-input: #2f2f2f;
            --text-primary: #ececf1;
            --accent-green: #10a37f;
            --border-color: #424242;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-main); color: var(--text-primary); }

        /* Sidebar */
        .sidebar { width: 260px; background-color: var(--bg-sidebar); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--border-color); }
        .btn-new { background: transparent; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; text-align: left; }
        .btn-new:hover { background: #2f2f2f; }

        .api-box { background: #2f2f2f; padding: 12px; border-radius: 8px; font-size: 12px; }
        .api-box label { display: block; margin-bottom: 6px; color: #ccc; }
        .api-box input { width: 100%; padding: 8px; background: #171717; border: 1px solid var(--border-color); color: white; border-radius: 6px; outline: none; }

        /* Main Chat */
        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; }
        .message { display: flex; gap: 16px; max-width: 768px; margin: 0 auto 20px auto; line-height: 1.6; }
        .avatar { width: 32px; height: 32px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .user .avatar { background: #5436da; }
        .ai .avatar { background: var(--accent-green); }

        /* Input */
        .input-area { padding: 20px; display: flex; justify-content: center; }
        .input-wrapper { width: 100%; max-width: 768px; position: relative; }
        textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 48px 14px 16px; color: #fff; resize: none; height: 52px; outline: none; }
        .send-btn { position: absolute; right: 12px; top: 10px; background: var(--accent-green); border: none; color: white; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="btn-new" onclick="resetChat()">+ Nouvelle discussion</button>
        
        <div class="api-box">
            <label for="api-key">Clé API Groq (Gratuite) :</label>
            <input type="password" id="api-key" placeholder="gsk_..." onchange="saveKey()">
        </div>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages-list">
            <div class="message ai">
                <div class="avatar">IA</div>
                <div class="text">Bonjour ! Veuillez entrer votre clé API Groq dans le panneau latéral pour commencer.</div>
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="prompt-input" placeholder="Envoyez un message..." onkeydown="handleKey(event)"></textarea>
                <button class="send-btn" onclick="sendPrompt()">➔</button>
            </div>
        </div>
    </div>

    <script>
        let messagesHistory = [
            { role: "system", content: "Tu es un assistant IA utile, précis et amical. Réponds en français." }
        ];

        // Charger la clé sauvegardée localement si elle existe
        document.getElementById('api-key').value = localStorage.getItem('groq_api_key') || '';

        function saveKey() {
            const key = document.getElementById('api-key').value.trim();
            localStorage.setItem('groq_api_key', key);
        }

        async function sendPrompt() {
            const apiKey = localStorage.getItem('groq_api_key') || document.getElementById('api-key').value.trim();
            if (!apiKey) {
                alert("Veuillez saisir une clé API Groq valide dans le panneau de gauche.");
                return;
            }

            const input = document.getElementById('prompt-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            messagesHistory.push({ role: "user", content: text });
            const aiTextDiv = appendMessage('ai', 'Réflexion...');

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: messagesHistory
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    aiTextDiv.innerText = "Erreur : " + data.error.message;
                } else {
                    const reply = data.choices[0].message.content;
                    aiTextDiv.innerText = reply;
                    messagesHistory.push({ role: "assistant", content: reply });
                }
            } catch (err) {
                aiTextDiv.innerText = "Erreur de réseau ou clé invalide.";
            }
        }

        function appendMessage(role, text) {
            const container = document.getElementById('messages-list');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="avatar">${role === 'user' ? 'Vous' : 'IA'}</div>
                <div class="text">${text}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div.querySelector('.text');
        }

        function handleKey(e) { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                sendPrompt(); 
            } 
        }
        
        function resetChat() { 
            messagesHistory = [
                { role: "system", content: "Tu es un assistant IA utile, précis et amical. Réponds en français." }
            ];
            document.getElementById('messages-list').innerHTML = `
                <div class="message ai">
                    <div class="avatar">IA</div>
                    <div class="text">Nouvelle discussion commencée.</div>
                </div>`; 
        }
    </script>
</body>
</html>
